name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout kara
        uses: actions/checkout@v4

      - name: Java setup kara
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Taji Android SDK install karto (corrupt cache tALto)
        uses: android-actions/setup-android@v3

      - name: SDK 35 platform + build-tools install karto
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;34.0.0" "platform-tools"

      - name: Flutter SDK setup kara
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Android platform files navin banva (android/ folder auto-generate)
        run: flutter create --platforms=android .

      - name: Kotlin version navin karto (compatibility fix)
        run: |
          sed -i -E 's/(id "org.jetbrains.kotlin.android" version )"[^"]+"/\1"1.9.22"/' android/settings.gradle
          cat android/settings.gradle

      - name: Sagle Kotlin stdlib versions ek sarkhya force kartho (dependency clash fix)
        run: |
          cat >> android/build.gradle << 'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.9.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
                  }
              }
          }
          EOF

      - name: compileSdk 35 var set karto
        run: |
          sed -i -E 's/compileSdk[ ]*=.*/compileSdk = 35/' android/app/build.gradle
          cat android/app/build.gradle

      - name: App cha display name "My Wallet" set karto
        run: |
          sed -i 's/android:label="[^"]*"/android:label="My Wallet"/' android/app/src/main/AndroidManifest.xml

      - name: Fixed debug keystore vaparto (SHA-1 kayamchi rahnyasathi)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Dependencies install kara
        run: flutter pub get

      - name: Navin App Icon generate karto
        run: dart run flutter_launcher_icons

      - name: Release APK build kara
        run: flutter build apk --release --no-tree-shake-icons

      - name: APK upload kara (download karnyasathi)
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
