name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout kara
        uses: actions/checkout@v4

      - name: Java setup kara
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter SDK setup kara
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Android platform files navin banva (android/ folder auto-generate)
        run: flutter create --platforms=android .

      - name: Dependencies install kara
        run: flutter pub get

      - name: Debug keystore chi SHA-1 fingerprint dakhva (Google Sign-In setup sathi)
        run: keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android

      - name: Release APK build kara
        run: flutter build apk --release

      - name: APK upload kara (download karnyasathi)
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
